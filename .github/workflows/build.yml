# =============================================================================
# AgentDesk — Build, Test & Release pipeline
#
# Triggers : push, pull_request, workflow_dispatch (manual run)
# Outputs  : 1) AgentDesk.exe        — ana kodlama ajanı masaüstü uygulaması
#            2) UsageLimitEditor.exe — kurumsal kota yönetim aracı
# A tag push (v*) or a manual dispatch additionally publishes a draft GitHub
# Release containing both compressed executables.
# =============================================================================
name: Build & Release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm etiketi (ör. v1.0.1) — boş bırakılırsa nightly olur"
        required: false
        default: ""
      create_release:
        description: "Taslak GitHub Release oluştur"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1) Test suite — headless Qt, runs on every push/PR for stability gating.
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install headless Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Run pytest (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  # ---------------------------------------------------------------------------
  # 2) Windows build — two standalone executables via PyInstaller.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows executables
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Sanity import check
        run: python -c "import agentdesk; print('agentdesk', agentdesk.__version__)"

      - name: Build AgentDesk.exe
        run: pyinstaller --clean --noconfirm packaging/agentdesk.spec

      - name: Build UsageLimitEditor.exe
        run: pyinstaller --clean --noconfirm packaging/usagelimiteditor.spec

      - name: Verify executables exist
        run: |
          dir dist
          if (!(Test-Path dist/AgentDesk.exe)) { throw "AgentDesk.exe missing" }
          if (!(Test-Path dist/UsageLimitEditor.exe)) { throw "UsageLimitEditor.exe missing" }

      - name: Compress artifacts
        run: |
          Compress-Archive -Path dist/AgentDesk.exe -DestinationPath AgentDesk-windows.zip -Force
          Compress-Archive -Path dist/UsageLimitEditor.exe -DestinationPath UsageLimitEditor-windows.zip -Force

      - name: Upload AgentDesk artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentDesk-windows
          path: |
            dist/AgentDesk.exe
            AgentDesk-windows.zip
          if-no-files-found: error

      - name: Upload UsageLimitEditor artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsageLimitEditor-windows
          path: |
            dist/UsageLimitEditor.exe
            UsageLimitEditor-windows.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3) Draft release — on version tag push or manual dispatch.
  # ---------------------------------------------------------------------------
  release:
    name: Publish draft release
    runs-on: ubuntu-latest
    needs: build-windows
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release)
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            VER="${{ inputs.version }}"
            if [[ -z "$VER" ]]; then VER="nightly-$(date +%Y%m%d-%H%M)"; fi
            echo "name=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: AgentDesk ${{ steps.tag.outputs.name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/AgentDesk-windows/AgentDesk.exe
            release-assets/AgentDesk-windows/AgentDesk-windows.zip
            release-assets/UsageLimitEditor-windows/UsageLimitEditor.exe
            release-assets/UsageLimitEditor-windows/UsageLimitEditor-windows.zip
